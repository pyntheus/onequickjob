# One per worktree: this worktree's API and web dev servers. INSTANCE comes from the
# Makefile (the worktree's directory name: main, lane-customer, ...), so lanes never
# collide. Ports bind to 127.0.0.1 only; view lanes through an SSH tunnel.
name: oqj-${INSTANCE:?run through make}

services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    image: oqj-api:${INSTANCE}
    container_name: oqj-${INSTANCE}-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      MONGO_URL: mongodb://oqj-mongo:27017/?replicaSet=rs0
      FILES_DIR: /data/files
      SEED_DIR: /app/seed
      # Off when the production-style API (sharing this database) is running: make dev decides.
      TASKS_ENABLED: ${DEV_TASKS_ENABLED:-true}
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/api/app"]
    ports:
      - "127.0.0.1:${API_PORT:?set API_PORT in .env}:8000"
    volumes:
      - ../api:/app/api
      - ../seed:/app/seed:ro
      - files:/data/files
    networks: [oqj]

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: oqj-web:${INSTANCE}
    container_name: oqj-${INSTANCE}-web
    restart: unless-stopped
    # The worktree owner, so files the dev server writes into the bind mount are theirs.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      API_UPSTREAM: http://oqj-${INSTANCE}-api:8000
      SITE_HOST: ${SITE_HOST:-dev.onequickjob.co.uk}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT in .env}:5173"
    volumes:
      - ../web:/app/web
      - /app/web/node_modules
      # The admin map's basemap (make basemap), served at /basemap by the dev server (vite.config.ts).
      - ../var/basemap:/app/var/basemap:ro
    depends_on: [api]
    networks: [oqj]

networks:
  oqj:
    name: oqj
    external: true

volumes:
  files:
    name: oqj-files-${INSTANCE}
    external: true
